---

- name: Check SSL config is exist
  set_fact:
    __postgresql_ssl_config: "{{ postgresql_conf | selectattr('ssl', 'defined') | list }}"

- debug:
    msg: "{{ __postgresql_ssl_config | length }} {{ __postgresql_ssl_config[0].ssl }}"

- name: Upload SSL certificates and keys
  when:
    - __postgresql_ssl_config | length > 0
    - __postgresql_ssl_config[0].ssl == true
  block:
    - name: Ensure SSL certificate and key directories exist
      ansible.builtin.file:
        path: "{{ item['dest'] }}"
        state: directory
        mode: "0755"
      loop: "{{ postgresql_config_upload_ssl_crt + postgresql_config_upload_ssl_key }}"

    - name: Upload SSL certificates
      ansible.builtin.copy:
        src: "{{ item['src'] }}"
        dest: "{{ item['dest'] | default(postgresql_conf_dir ~ '/ssl') }}"
        backup: "{{ item['backup'] | default(true) }}"
        mode: "0640"
      loop: "{{ postgresql_config_upload_ssl_crt }}"
      # notify: (Handler - NGINX Config) Run NGINX

    - name: Upload SSL keys
      ansible.builtin.copy:
        src: "{{ item['src'] }}"
        dest: "{{ item['dest'] | default(postgresql_conf_dir ~ '/ssl') }}"
        backup: "{{ item['backup'] | default(true) }}"
        mode: "0640"
      loop: "{{ postgresql_config_upload_ssl_key }}"
      # notify: (Handler - NGINX Config) Run NGINX
      no_log: true